<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title">
  <title id="title">Convert a PDF to Word on iPhone</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e8"/>
      <stop offset="1" stop-color="#efe4d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="180" fill="#ccfbf1" opacity="0.7"/>
  <circle cx="120" cy="600" r="160" fill="#ffedd5" opacity="0.8"/>

  <!-- iPhone -->
  <rect x="430" y="78" width="340" height="520" rx="42" fill="#1c1917"/>
  <rect x="448" y="98" width="304" height="480" rx="28" fill="#fffdf8"/>
  <circle cx="600" cy="548" r="14" fill="#1c1917" opacity="0.2"/>

  <!-- PDF page -->
  <g transform="translate(478,150)">
    <rect width="108" height="148" rx="10" fill="#fff" stroke="#e7d8c4" stroke-width="3"/>
    <rect x="16" y="22" width="76" height="10" rx="4" fill="#b45309"/>
    <rect x="16" y="42" width="62" height="8" rx="4" fill="#e7d8c4"/>
    <rect x="16" y="58" width="70" height="8" rx="4" fill="#e7d8c4"/>
    <rect x="16" y="74" width="54" height="8" rx="4" fill="#e7d8c4"/>
    <text x="54" y="122" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#b45309">PDF</text>
  </g>

  <!-- arrow -->
  <path d="M612 224h56" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <path d="M652 208l24 16-24 16" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Word page -->
  <g transform="translate(614,150)">
    <rect width="108" height="148" rx="10" fill="#fff" stroke="#ccfbf1" stroke-width="3"/>
    <rect x="16" y="22" width="76" height="10" rx="4" fill="#0f766e"/>
    <rect x="16" y="42" width="70" height="8" rx="4" fill="#d6d3d1"/>
    <rect x="16" y="58" width="64" height="8" rx="4" fill="#d6d3d1"/>
    <rect x="16" y="74" width="72" height="8" rx="4" fill="#d6d3d1"/>
    <text x="54" y="122" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0f766e">DOCX</text>
  </g>

  <text x="600" y="430" text-anchor="middle" font-family="Outfit, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1c1917">PDF to Word</text>
  <text x="600" y="468" text-anchor="middle" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="18" fill="#57534e">On iPhone, in Safari</text>
</svg>
